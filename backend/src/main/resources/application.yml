server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:pnube-secret-key-change-in-production-minimum-256-bits-long-hmac-key}
    expiration-ms: 86400000

admin:
  username: admin
  password: ${ADMIN_PASSWORD:admin123}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  success-url: ${MP_SUCCESS_URL:http://localhost:4200/checkout/success}
  failure-url: ${MP_FAILURE_URL:http://localhost:4200/checkout/failure}
  pending-url: ${MP_PENDING_URL:http://localhost:4200/checkout/pending}
