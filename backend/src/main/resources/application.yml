server:
  port: ${PORT:8080}

spring:
  jackson:
    time-zone: America/Argentina/Cordoba
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

admin:
  username: admin
  password: ${ADMIN_PASSWORD}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  success-url: ${MP_SUCCESS_URL:http://localhost:4200/checkout/success}
  failure-url: ${MP_FAILURE_URL:http://localhost:4200/checkout/failure}
  pending-url: ${MP_PENDING_URL:http://localhost:4200/checkout/pending}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
