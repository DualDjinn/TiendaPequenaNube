server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/pnube
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

app:
  jwt:
    secret: ${JWT_SECRET:pnube-secret-key-change-in-production-minimum-256-bits-long-hmac-key}
    expiration-ms: 86400000

admin:
  username: admin
  password: ${ADMIN_PASSWORD:admin123}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  success-url: "http://localhost:4200/checkout/success"
  failure-url: "http://localhost:4200/checkout/failure"
  pending-url: "http://localhost:4200/checkout/pending"
